databases:
  - name: bookstore-db
    plan: free

services:
  - type: web
    name: bookstore-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /hello/
    autoDeploy: false
    preDeployCommand: python manage.py migrate
    envVars:
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com localhost 127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
      - key: SQL_ENGINE
        value: django.db.backends.postgresql
      - key: SQL_DATABASE
        fromDatabase:
          name: bookstore-db
          property: database
      - key: SQL_USER
        fromDatabase:
          name: bookstore-db
          property: user
      - key: SQL_PASSWORD
        fromDatabase:
          name: bookstore-db
          property: password
      - key: SQL_HOST
        fromDatabase:
          name: bookstore-db
          property: host
      - key: SQL_PORT
        fromDatabase:
          name: bookstore-db
          property: port